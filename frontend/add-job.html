<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a Job | Job App</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/add-job.css"><link rel="stylesheet" href="/css/app.css"></head>
<body><nav class="navbar navbar-expand-lg navbar-light sticky-top"><div class="container"><a class="navbar-brand" href="/"><span class="brand-mark">J</span>Job App</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto"><li><a class="nav-link" href="/">Home</a></li><li><a class="nav-link" href="/jobs.html">All Jobs</a></li><li><a class="nav-link active" href="/add-job.html">Post a Job</a></li></ul></div></div></nav>
<main class="page-shell"><div class="container"><div class="page-heading text-center"><div class="kicker" id="form-kicker">For employers</div><h1 id="form-title">Post your next great opportunity</h1><p class="mx-auto">Create a clear job listing and connect with candidates who have the skills your team needs.</p></div><div class="row justify-content-center"><div class="col-lg-7"><div class="form-card"><h2>Job details</h2><p class="form-intro">Share the role, experience level, and skills your team needs.</p><div id="notice" class="notice" role="status"></div><form id="job-form"><div class="mb-3"><label for="postProfile" class="form-label">Job title</label><input type="text" class="form-control" id="postProfile" required maxlength="120" placeholder="e.g. Java Backend Developer"></div><div class="mb-3"><label for="postDesc" class="form-label">Job description</label><textarea class="form-control" id="postDesc" rows="4" required maxlength="4000" placeholder="Describe the role and responsibilities"></textarea></div><div class="mb-3"><label for="reqExperience" class="form-label">Required experience (years)</label><input type="number" min="0" max="60" class="form-control" id="reqExperience" required value="0"></div><div class="mb-3"><label for="postTechStack" class="form-label">Technologies and skills</label><input type="text" class="form-control" id="postTechStack" placeholder="Java, Spring Boot, PostgreSQL"><div class="form-help">Separate skills with commas.</div></div><button id="submit-job" type="submit" class="btn btn-submit">Publish job post</button><a class="cancel-link" href="/jobs.html">Cancel</a></form></div></div></div></div></main><script src="/js/config.js"></script><script src="/js/job-form.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script></body></html>
